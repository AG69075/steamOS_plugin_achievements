name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package plugin zip
        run: |
          mkdir -p /tmp/pkg/steam-achievements
          cp -r dist main.py plugin.json package.json README.md /tmp/pkg/steam-achievements/
          cd /tmp/pkg
          zip -r steam-achievements.zip steam-achievements
          mv steam-achievements.zip "$GITHUB_WORKSPACE/steam-achievements.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: steam-achievements.zip
