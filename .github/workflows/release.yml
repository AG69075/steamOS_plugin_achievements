name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create zip
        run: |
          mkdir -p build
          zip -r build/plugin-${{ github.ref_name }}.zip \
            dist \
            images \
            main.py \
            package.json \
            plugin.json \
            README.md \
            -x "*.gitignore"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true